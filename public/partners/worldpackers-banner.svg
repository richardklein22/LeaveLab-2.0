<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient similar to the Worldpackers brand -->
  <rect width="1200" height="400" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="400">
      <stop offset="0%" stop-color="#2C5F6F"/>
      <stop offset="100%" stop-color="#4A8B9E"/>
    </linearGradient>
  </defs>
  
  <!-- Hiker silhouette -->
  <g transform="translate(300, 100)">
    <ellipse cx="60" cy="40" rx="30" ry="30" fill="#E8F4F8" opacity="0.3"/>
    <rect x="50" y="70" width="20" height="50" rx="5" fill="#E8F4F8" opacity="0.3"/>
    <rect x="55" y="120" width="10" height="40" rx="3" fill="#E8F4F8" opacity="0.3"/>
    <rect x="65" y="130" width="10" height="30" rx="3" fill="#E8F4F8" opacity="0.3"/>
    <!-- Backpack -->
    <rect x="45" y="75" width="15" height="25" rx="3" fill="#E8F4F8" opacity="0.4"/>
  </g>
  
  <!-- Globe icon with person traveling -->
  <g transform="translate(100, 150)">
    <circle cx="50" cy="50" r="45" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6"/>
    <ellipse cx="50" cy="50" rx="45" ry="20" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>
    <line x1="50" y1="5" x2="50" y2="95" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <path d="M 50 20 Q 30 50, 50 80" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="50" cy="30" r="8" fill="#FFD166"/>
  </g>
  
  <!-- Worldpackers Text -->
  <text x="500" y="220" font-family="'Arial', sans-serif" font-size="120" font-weight="700" fill="#FFFFFF" letter-spacing="-2">
    Worldpackers
  </text>
  
  <!-- Tagline -->
  <text x="500" y="260" font-family="'Arial', sans-serif" font-size="28" fill="#E8F4F8" letter-spacing="1" opacity="0.9">
    TRAVEL • CONNECT • EXPERIENCE
  </text>
</svg>




